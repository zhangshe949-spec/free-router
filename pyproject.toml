[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "free-router"
version = "0.3.0"
description = "OpenAI-compatible gateway that aggregates free/paid LLM providers with automatic, task-aware failover. Standalone: no agent framework required."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "zhangshe949-spec", url = "https://github.com/zhangshe949-spec" }]
classifiers = [
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
license = { text = "Proprietary - All Rights Reserved (see LICENSE)" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
free-router = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["../static/*", "../config/*.yaml"]
