[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "free-router"
version = "0.4.0"
description = "OpenAI-compatible gateway that aggregates free/paid LLM providers with automatic, task-aware failover. Standalone: no agent framework required."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "pydantic>=2.0",
  "structlog>=24.1",
  "prometheus-client>=0.19",
  "opentelemetry-api>=1.21",
  "opentelemetry-sdk>=1.21",
  "opentelemetry-instrumentation-fastapi>=0.42",
  "opentelemetry-exporter-otlp>=1.13",
  "python-jose[cryptography]>=3.3",
  "pycircuitbreaker>=1.0",
  "watchfiles>=0.21",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx-mock>=0.7",
  "fakeredis>=2.20",
  "pytest-cov>=4.1",
]
docs = [
  "mkdocs>=1.5",
  "mkdocs-material>=9.4",
  "mkdocstrings[python]>=0.24",
]

[project.scripts]
free-router = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["../static/*", "../config/*.yaml", "../plugins/*"]
