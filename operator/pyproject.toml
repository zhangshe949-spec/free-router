[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "free-router-operator"
version = "0.1.0"
description = "Kubernetes Operator for free-router (kopf-based)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "kopf>=1.37",
    "kubernetes>=30.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-mock>=3.12"]

[project.scripts]
free-router-operator = "operator.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["operator*"]