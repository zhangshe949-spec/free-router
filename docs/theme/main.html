{% extends "base.html" %}

{# 赛博朋克主题覆盖：注入 Google Fonts + 背景层（Canvas 网格 / 扫描线 / 暗角）。 #}

{% block extrahead %}
  {{ super() }}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#0a0a0f">
{% endblock %}

{% block scripts %}
  {{ super() }}
  <canvas id="cyber-grid" aria-hidden="true"></canvas>
  <div class="cyber-scanlines" aria-hidden="true"></div>
  <div class="cyber-vignette" aria-hidden="true"></div>
{% endblock %}
