# Free-Router 配置示例
# 兜底密钥来源：本目录 .env 优先，其次下列文件（避免同一套 key 多处维护）
# 密钥兜底来源（按顺序叠加，先到先得）。相对路径相对仓库根目录。
#   本目录 .env 优先；~/.free-router/.env 适合多实例共享；也可填任意绝对路径
env_files:
  - ~/.free-router/.env
server:
  host: 0.0.0.0
  port: 8787
  openai_base: /v1
  # 对外只暴露一个聚合模型别名：智能体侧只看到 free-router，实际用哪个模型由本服务自动轮转
  model_alias: free-router
  expose_single_model: true       # false = 列出全部真实模型（仅调试用）
  alias_show_count: true          # 别名后缀显示「(N 个模型轮转)」
  access_key: ""                  # 可选网关访问密钥（WebSocket/批量端点鉴权；空=不鉴权）

# 提供商池（免费/收费均可，用 type 区分）
providers:
  amd-radeon:
    base_url: https://developer.amd.com.cn/radeon/api/v1
    # 键名多候选：兼容常见的 RADEON_API_KEY 与本项目旧名 AMD_API_KEY
    key_env: [RADEON_API_KEY, AMD_API_KEY]
    api_key: ""                     # 或在此手动填写 rc-xxx 密钥（优先级高于 key_env）
    request_timeout: 30
    tier_quality: high
    models:
      - id: DeepSeek-V4-Flash
        capability: {score: 78, code: 82, reason: 80, long: 70, vision: false}
        tier: high
        type: free                    # free | paid（免费池默认 free）
        tags: [reasoning, code, long] # 能力标签：供任务感知选型打分
        context_window: 131072
        max_output_tokens: 8192
        pricing_per_1k_tokens: {input: 0.0, output: 0.0}
        supported_parameters: [temperature, top_p, max_tokens, tools]
      - id: DeepSeek-V4-Flash-Vision-Exp
        capability: {score: 79, code: 80, reason: 79, long: 72, vision: true}
        tier: high
      - id: Qwen3.8-Flash-Next
        capability: {score: 70, code: 72, reason: 68, long: 66, vision: false}
        tier: medium
      - id: Qwen2.5-VL-72B
        capability: {score: 72, code: 70, reason: 72, long: 60, vision: true}
        tier: medium

  modelscope:
    base_url: https://api-inference.modelscope.cn/v1
    key_env: [MODELSCOPE_API_KEY, HERMES_CUSTOM_MODELSCOPE_API_KEY]
    api_key: ""                     # 或在此手动填写（三家工具各自独立 key）
    request_timeout: 30
    tier_quality: high
    models:
      - id: Qwen/Qwen3.8-Flash-Next
        capability: {score: 70, code: 72, reason: 68, long: 66, vision: false}
        tier: medium
        context_window: 32768
        max_output_tokens: 4096
        pricing_per_1k_tokens: {input: 0.0, output: 0.0}
        supported_parameters: [temperature, top_p, max_tokens]
      - id: OpenGVLab/InternVL3_5-241B-A28B
        capability: {score: 74, code: 70, reason: 74, long: 60, vision: true}
        tier: medium

  kilogw:
    base_url: https://api.kilo.ai/api/openrouter
    key_env: ""                     # 免 key
    extra_headers:
      Authorization: ''
    request_timeout: 10
    tier_quality: high
    # 用户策略：自动池只收免费模型（:free 后缀 / kilo-auto/free）；
    # 付费模型（claude/gpt 等）默认不进自动 fallback，仅在你显式指定时使用。
