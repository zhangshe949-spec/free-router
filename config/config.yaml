    # 直接调用会被指纹闸门拒（"free tier can only be used from within OpenCode"）；
    # app/providers/zen.py 负责补齐会话头 + 指纹工具 + 强制流式，等价于
    # opencode2dsh / dsh-opencode-free-models 那类插件的做法，但不用装任何插件。
    base_url: https://opencode.ai/zen/v1
    key_env: ""                     # 免 key（适配器内部固定 Bearer public）
    api_key: ""
    request_timeout: 120            # 免费车道实测常 2~15s，长答案最慢约 60s
