    models:
    - id: doubao-seed-1.6
      capability:
        score: 74
        code: 74
        reason: 74
        long: 76
        vision: true
      tier: high
    - id: deepseek-v3.1
      capability:
        score: 76
        code: 80
        reason: 78
        long: 74
        vision: false
      tier: high
router:
  max_retries: 20
  use_selector: true
  sticky_ttl_seconds: 1800
  prefer_vision_for_unknown: true
  provider_order:
  - amd-radeon
  - modelscope
  - kilogw
  - zhipu
  - siliconflow
  - qianfan
  - hunyuan
  - spark
  - dashscope
  - ark
quota:
  rpm_limit: 60
  rpd_limit: 1000
  tpm_limit: 200000
  tpd_limit: 5000000
  cooldown_429: 60
  cooldown_429_escalate:
  - 300
  - 1800
  cooldown_5xx: 30
  cooldown_persist_db: true
  predict_window_seconds: 30
  predict_threshold_seconds: 20
lifecycle:
  refresh_interval_hours: 12
  enable_discovery: true
  discovery_urls:
    amd-radeon: https://developer.amd.com.cn/radeon/api/v1/models
    modelscope: https://api-inference.modelscope.cn/v1/models
    kilogw: https://api.kilo.ai/api/openrouter/models
    zhipu: https://open.bigmodel.cn/api/paas/v4/models
    siliconflow: https://api.siliconflow.cn/v1/models
    qianfan: https://qianfan.baidubce.com/v2/models
    hunyuan: https://api.hunyuan.cloud.tencent.com/v1/models
    spark: https://spark-api-open.xf-yun.com/v1/models
    dashscope: https://dashscope.aliyuncs.com/compatible-mode/v1/models
    ark: https://ark.cn-beijing.volces.com/api/v3/models
logging:
  level: INFO
  file: data/free_router.log
cache:
  enabled: true
  ttl_seconds: 86400
  max_entries: 2000
  serve_hits: false
metrics:
  enabled: true
alerter:
  enabled: false
  type: webhook
  webhook_url: ''
  smtp_host: ''
  smtp_port: 587
  smtp_user: ''
  smtp_password: ''
  smtp_from: ''
  smtp_to: []
  error_rate_threshold: 0.3
  window_seconds: 300
  min_interval_seconds: 600
  fallback_to_paid: false
