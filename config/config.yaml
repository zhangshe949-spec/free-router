    - RADEON_API_KEY
    - AMD_API_KEY
    api_key: ''
    request_timeout: 30
    tier_quality: high
    models:
    - id: DeepSeek-V4-Flash
      capability:
        score: 78
        code: 82
        reason: 80
        long: 70
        vision: false
      tier: high
      type: free
      tags:
      - reasoning
      - code
      - long
    - id: DeepSeek-V4-Flash-Vision-Exp
      capability:
        score: 79
        code: 80
        reason: 79
        long: 72
        vision: true
      tier: high
