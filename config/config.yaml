# 路由
router:
  max_retries: 20
  use_selector: true              # 任务感知选型（免费/收费 + 标签 + 质量分级）
  # 可插拔打分策略（留空=内置算法）。自定义示例：
  # policy:
  #   module: my_pkg.my_policies
  #   class: WeightedPolicy
  #   args: {weight_code: 2.0}
  sticky_ttl_seconds: 1800        # 30分钟粘性窗口
  prefer_vision_for_unknown: true # 未知任务若图片则偏视觉模型
  provider_order: [amd-radeon, zen, modelscope, kilogw, zhipu, siliconflow, qianfan, hunyuan, spark, dashscope, ark]  # 回退链（本地已移除）

# 额度监控
quota:
  rpm_limit: 60
  rpd_limit: 1000
  tpm_limit: 200000
  tpd_limit: 5000000
  # 轮转时长：429 只短暂隔离，尽快让恢复的模型回到候选（不长时间空等）
  cooldown_429: 30
  cooldown_429_escalate: [60, 300]
  cooldown_5xx: 20
  cooldown_persist_db: true
  # 额度预测：按近期速率预估「还能撑多久」，低于阈值就提前换别的模型（自愈）
  predict_window_seconds: 30
  predict_threshold_seconds: 20
  # 内部守护巡检：每 15s 释放已到期冷却；冷却比例超阈值自动重新发现
  recovery_check_seconds: 15
  cooled_ratio_trigger: 0.6
  probe_stale_seconds: 300

# 生命周期
lifecycle:
  refresh_interval_hours: 12
  enable_discovery: true
  discovery_urls:
    amd-radeon: https://developer.amd.com.cn/radeon/api/v1/models
    modelscope: https://api-inference.modelscope.cn/v1/models
    kilogw: https://api.kilo.ai/api/openrouter/models
    # Phase 1 新增（部分需 key；失败由 lifecycle try/except 容错）
    zhipu: https://open.bigmodel.cn/api/paas/v4/models
    siliconflow: https://api.siliconflow.cn/v1/models
    qianfan: https://qianfan.baidubce.com/v2/models
    hunyuan: https://api.hunyuan.cloud.tencent.com/v1/models
    spark: https://spark-api-open.xf-yun.com/v1/models
    dashscope: https://dashscope.aliyuncs.com/compatible-mode/v1/models
    # ark 不放进自动发现：它的 /models 混有图像/视频/3D 生成模型，
    # 自动加会把非对话模型灌进候选池。对话模型改为在 providers.ark.models 手工维护。

# ===== Autofree 自动调度（P10）=====
# 用户选 model: "autofree" 即可：自动调度最强免费模型、前 10 耗尽顺延、恢复即切回
autofree:
  enabled: true
  top_n: 10                    # 核心榜单数量
  fallback_n: 10               # 兜底榜单数量（第 11~20 名）
  recompute_interval_hours: 1  # 榜单重算间隔
  sticky_ttl_seconds: 60       # 会话粘性 TTL（自动模式建议短，快速感知恢复）
  max_retries: 30              # 最大重试次数（比标准模式大，覆盖更多模型）
  min_runtime_requests: 5      # 运行时统计生效门槛（<5 次仅用静态评分）

# ===== Smart-Free 智能路由（P11）=====
# 用户选 model: "smart-free" 即可：自动识别任务类型 → 匹配最优免费模型 →
# 负载均衡调度 → 跨 16 家提供商配额池管理 → 预测性轮转 → 无限 token 畅聊
smart_free:
  enabled: true
  load_balance_strategy: weighted_round_robin  # round_robin | weighted_round_robin | least_connections | health_first
  sticky_ttl_seconds: 300        # 会话粘性 TTL（智能模式建议 5 分钟）
  max_retries: 50                # 最大重试次数（跨 16 家提供商，需要更多重试）
  min_runtime_requests: 5        # 运行时统计生效门槛

# ===== 可持续性管理器 =====
# 跨提供商配额池管理、健康评分、预测性轮转
sustainability:
  enabled: true
  global_quota_threshold: 0.15   # 全局剩余额度低于 15% 时触发告警
  health_check_interval: 60      # 健康检查间隔（秒）
  auto_failover: true            # 自动故障转移
  learning_enabled: true         # 启用学习型路由（根据历史成功率动态调整）

# 日志
logging:
  level: INFO
  file: data/free_router.log

# ---------------- 响应缓存 / 离线容灾（P2）----------------
# 全部模型都不可用时，用最近一次成功响应兜底，保证任务不中断；
# serve_hits=true 则命中即直接返回（省额度，但可能返回过期内容，默认关闭）。
cache:
  enabled: true
  ttl_seconds: 86400
  max_entries: 2000
  serve_hits: false

# ---------------- 指标（P5）----------------
# GET /metrics（Prometheus 文本格式，零依赖）
metrics:
  enabled: true

# ---------------- 错误告警（P6，默认关闭）----------------
# 近 window_seconds 内错误率超过阈值 → webhook/SMTP 告警；
# fallback_to_paid=true 时可在告警期临时把 type: paid 的模型提前。
alerter:
  enabled: false
  type: webhook              # webhook | smtp | none
  webhook_url: ""
  smtp_host: ""
  smtp_port: 587
  smtp_user: ""
  smtp_password: ""
  smtp_from: ""
  smtp_to: []
  error_rate_threshold: 0.3
  window_seconds: 300
  min_interval_seconds: 600
  fallback_to_paid: false

# ---------------- 可观测性（Observability）----------------
# 结构化日志、链路追踪、指标、健康检查、熔断器、请求队列
observability:
  log_level: INFO
  json_logs: true
  service_name: free-router
  otlp_endpoint: ""          # 如: http://jaeger:4317
  console_export: false
  otlp_headers: {}            # OTLP 额外头（如鉴权 Authorization）
  sampling_ratio: 1.0         # 采样率 0~1
  propagators: [tracecontext, baggage]
  metric_export_interval: 60  # 指标导出间隔（秒）
  # 指标
  metrics_enabled: true
  metrics_port: 9090
  # 健康检查
  health_check_enabled: true
  health_check_interval_seconds: 30.0
  health_check_timeout_seconds: 5.0
  # 熔断器
  circuit_breaker_enabled: true
  circuit_breaker_failure_threshold: 0.5
  circuit_breaker_success_threshold: 3
  circuit_breaker_window_size: 100
  circuit_breaker_window_time: 60.0
  # 请求队列（背压）
  queue_enabled: true
  queue_max_size: 50
  queue_max_wait_time: 30.0

# ---------------- 收费模型接入示例（P0，密钥一律留空）----------------
# 与免费模型放在同一个 providers 池里，用 type: paid 区分：
#   * 默认（prefer_free=true）不会被自动选中；
#   * 请求里显式指定 model、或 free_router.prefer_free=false 时才会用；
#   * 一旦使用，响应头会带 X-Free-Router-Model-Type: paid 与提醒文案。
#
# paid-example:
#   base_url: https://api.deepseek.com/v1
#   key_env: DEEPSEEK_API_KEY
#   api_key: ""              # 手动填写或放 .env，绝不写死在仓库里
#   type: paid
#   request_timeout: 60
#   tier_quality: high
#   models:
#     - id: deepseek-chat
#       capability: {score: 82, code: 84, reason: 82, long: 80, vision: false}
#       tier: high
#       type: paid
#       tags: [reasoning, code]

# ---------------- 插件框架（P9）----------------
# 启动时动态加载（module.class 实例化，config 透传给插件构造器）。
# 内置示例见 app/plugins/builtin.py：
#   * RequestLoggerPlugin       结构化日志请求/响应
#   * ResponseTransformerPlugin 响应变换（如去除思考链 reasoning_content / thinking）
plugins:
  - name: request-logger
    module: app.plugins.builtin
    class: RequestLoggerPlugin
    config: {}
  - name: response-transformer
    module: app.plugins.builtin
    class: ResponseTransformerPlugin
    config:
      strip_keys: [reasoning_content, thinking, reasoning]

# ---------------- 鉴权（P9）----------------
# API Key / JWT / RBAC。api_keys 留空且 server.access_key 为空 = 不鉴权。
auth:
  api_keys: []
    # - key: "sk-xxx"
    #   tenant: default
    #   scopes: [chat, batch, ws]       # chat / batch / ws / admin / read
    #   roles: [user]
    #   rate_limit: {rpm: 60, rpd: 1000}
    #   models_allowlist: []
    #   models_denylist: []
  jwt: {}
    # issuer: ""
    # audience: ""
    # jwks_url: ""
    # algorithm: RS256
  rbac:
    admin: ["*"]
    user: [chat, batch, ws]
    viewer: [read]
