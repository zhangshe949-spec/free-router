# Default values for free-router.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/zhangshe949-spec/free-router
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  readOnlyRootFilesystem: false

service:
  type: ClusterIP
  port: 8787
  targetPort: 8787

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: free-router.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: "1"
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1

nodeSelector: {}

tolerations: []

affinity: {}

# --- Provider API 密钥（注入为环境变量，走 Secret） ---
# 生产环境请用 existingSecret 或 sealed-secrets；此处仅为演示。
secret:
  data: {}
    # RADEON_API_KEY: "rc-xxxx"
    # ZAI_API_KEY: "xxxx"
# 引用已有 Secret（非空则跳过创建，直接用该 Secret 做 envFrom）
existingSecret: ""

# --- 完整 config.yaml（覆盖仓库内 config/config.yaml） ---
# 任意字段均可在此覆盖；密钥一律留空，从上面的 Secret 环境变量读取。
config:
  server:
    host: 0.0.0.0
    port: 8787
    model_alias: free-router
    expose_single_model: true
    alias_show_count: true
    access_key: ""
  router:
    max_retries: 20
    use_selector: true
    sticky_ttl_seconds: 1800
  quota:
    rpm_limit: 60
    rpd_limit: 1000
    tpm_limit: 200000
    tpd_limit: 5000000
    cooldown_429: 30
    cooldown_429_escalate: [60, 300]
    cooldown_5xx: 20
  lifecycle:
    refresh_interval_hours: 12
    enable_discovery: true
    discovery_urls: {}
  logging:
    level: INFO
  cache:
    enabled: true
    ttl_seconds: 86400
    max_entries: 2000
    serve_hits: false
  metrics:
    enabled: true
  observability:
    log_level: INFO
    json_logs: true
    service_name: free-router
    otlp_endpoint: ""
    otlp_headers: {}
    sampling_ratio: 1.0
    propagators: [tracecontext, baggage]
    metric_export_interval: 60
    console_export: false
  providers: {}
  auth:
    api_keys: []
    jwt: {}
    rbac:
      admin: ["*"]
      user: ["chat", "batch", "ws"]
      viewer: ["read"]

serviceMonitor:
  enabled: false
  interval: 30s
  path: /metrics
  port: http

probes:
  liveness:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 15
  readiness:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
