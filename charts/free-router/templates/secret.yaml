{{- if and (not .Values.existingSecret) .Values.secret.data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "free-router.fullname" . }}-secret
  labels:
    {{- include "free-router.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secret.data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
