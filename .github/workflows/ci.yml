name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Python 3.11 测试与冒烟
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 导入冒烟测试（import app.main）
        run: python -c "import app.main; print('app.main 导入成功')"

      - name: 运行测试（pytest）
        run: pytest -q