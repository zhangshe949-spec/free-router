name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: 密钥扫描
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 扫描硬编码凭据
        run: python scripts/scan_secrets.py .

  test:
    name: Python 3.11 测试与冒烟
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 导入冒烟测试（import app.main）
        run: python -c "import app.main; print('app.main 导入成功')"

      - name: 运行测试（pytest）
        run: pytest -q

  lint:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: Ruff 致命错误检查
        run: ruff check . --select E9,F63,F7,F82
      - name: 编译检查
        run: python -m compileall -q app scripts